<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030806"/>
      <stop offset="1" stop-color="#0b1a10"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M40 22 H960 Q978 22 978 40 V190 Q978 208 960 208 H40 Q22 208 22 190 V40 Q22 22 40 22 Z"/>
  </defs>

  <rect width="1000" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)"/>

  <!-- race track -->
  <use href="#track" fill="none" stroke="#00ff41" stroke-opacity="0.18" stroke-width="18"/>
  <use href="#track" fill="none" stroke="#00ff41" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>
  </use>

  <!-- start/finish line -->
  <g transform="translate(120 13)">
    <rect width="6" height="6" fill="#e8ffe8"/><rect x="6" y="6" width="6" height="6" fill="#e8ffe8"/>
    <rect y="12" width="6" height="6" fill="#e8ffe8"/><rect x="6" width="6" height="6" fill="#0b1a10"/>
    <rect y="6" width="6" height="6" fill="#0b1a10"/><rect x="6" y="12" width="6" height="6" fill="#0b1a10"/>
  </g>

  <!-- text -->
  <text x="500" y="105" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="44" font-weight="700" fill="#00ff41" filter="url(#glow)">&gt; Akshay Valerio Vanalli<tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text x="500" y="148" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="19" fill="#9dffb0" fill-opacity="0.85">Computing Science Student  |  Placement Applicant</text>
  <text x="500" y="178" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#00ff41" fill-opacity="0.5">[ cybersecurity · AI · trading · games ]</text>

  <!-- go-kart, top-down view, facing +x -->
  <g>
    <g transform="scale(1.45) translate(-17 -12)">
      <!-- exhaust puffs -->
      <circle cx="-4" cy="12" r="3" fill="#00ff41" opacity="0.35">
        <animate attributeName="cx" values="-2;-14" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <!-- wheels -->
      <rect x="3" y="-1" width="9" height="5" rx="1.5" fill="#111" stroke="#00ff41" stroke-width="0.8"/>
      <rect x="3" y="20" width="9" height="5" rx="1.5" fill="#111" stroke="#00ff41" stroke-width="0.8"/>
      <rect x="23" y="0" width="8" height="4" rx="1.5" fill="#111" stroke="#00ff41" stroke-width="0.8"/>
      <rect x="23" y="20" width="8" height="4" rx="1.5" fill="#111" stroke="#00ff41" stroke-width="0.8"/>
      <!-- body -->
      <path d="M1 6 H26 Q35 7 36 12 Q35 17 26 18 H1 Z" fill="#00ff41"/>
      <rect x="31" y="7" width="3" height="10" rx="1" fill="#0b1a10"/>
      <!-- driver helmet -->
      <circle cx="13" cy="12" r="5.5" fill="#0b1a10" stroke="#9dffb0" stroke-width="1.2"/>
      <rect x="15" y="9.5" width="3" height="5" rx="1" fill="#9dffb0"/>
    </g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
  </g>
</svg>
